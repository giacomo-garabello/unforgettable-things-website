<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Illustration looking down into an open cardboard box holding passports, a document folder, an envelope and a small pouch">
  <g stroke="#231A16" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- shelf and box -->
    <rect x="0" y="0" width="480" height="360" fill="#E2C3B7" stroke="none"/>
    <path d="M14 22 L60 50 V310 L14 338 Z" fill="#F1D4B0"/>
    <path d="M466 22 L420 50 V310 L466 338 Z" fill="#F1D4B0"/>
    <path d="M60 50 H420 V310 H60 Z" fill="#D9AE80"/>
    <path d="M60 50 L80 64 H400 L420 50" fill="#C99A6B"/>
    <path d="M14 22 L60 50 M466 22 L420 50 M14 338 L60 310 M466 338 L420 310" fill="none"/>

    <!-- passports -->
    <g transform="rotate(-8 128 150)">
      <rect x="86" y="96" width="78" height="108" rx="6" fill="#5A2A1F"/>
    </g>
    <g transform="rotate(5 132 146)">
      <rect x="92" y="90" width="80" height="110" rx="6" fill="#16504D"/>
      <circle cx="132" cy="134" r="14" fill="none" stroke="#FFD84D" stroke-width="2.5"/>
      <path d="M118 134 h28 M132 120 v28" stroke="#FFD84D" stroke-width="2"/>
      <path d="M110 170 h44 M116 180 h32" stroke="#FFD84D" stroke-width="2.5"/>
    </g>

    <!-- document folder -->
    <rect x="214" y="78" width="160" height="104" rx="4" fill="#FFFFFF" stroke-width="2"/>
    <path d="M226 92 h120 M226 104 h104 M226 116 h112" stroke="#CDA999" stroke-width="2"/>
    <path d="M200 96 h52 l10 -12 h126 v114 h-188 z" fill="#FFD84D"/>
    <rect x="230" y="140" width="64" height="18" rx="3" fill="#FFFFFF" stroke-width="2"/>

    <!-- envelope -->
    <g transform="rotate(-4 262 254)">
      <rect x="196" y="214" width="132" height="82" rx="4" fill="#FFFFFF"/>
      <path d="M196 218 L262 260 L328 218" fill="none"/>
      <path d="M196 292 L246 252 M328 292 L278 252" fill="none" stroke-width="2"/>
    </g>

    <!-- pouch -->
    <path d="M356 222 h52 c6 0 10 4 10 10 v54 c0 6 -4 10 -10 10 h-52 c-6 0 -10 -4 -10 -10 v-54 c0 -6 4 -10 10 -10 z" fill="#CDE8E5"/>
    <path d="M346 238 h72" stroke-width="2.5"/>
    <rect x="404" y="232" width="10" height="14" rx="3" fill="#FFD84D" stroke-width="2"/>

    <!-- pen -->
    <path d="M88 246 l80 40 l-6 10 l-80 -40 z" fill="#FFFFFF" stroke-width="2.5"/>
    <path d="M168 286 l10 9 l-14 1 z" fill="#231A16" stroke-width="2"/>
  </g>
</svg>
